# ============================================================
# Galbot 干净数据采集配置 (beat_block_hammer)
# 用于 --clean-episodes 数据采集和 --task_config 干净评估
# 无随机背景、无杂物、固定光照 — 最理想的简单场景
# ============================================================

render_freq: 0               # 渲染频率（0=不限制）
episode_num: 1                # 每次采集的 episode 数
use_seed: false               # 是否使用固定种子
save_freq: 15                 # 每隔多少帧保存一次数据
embodiment: [galbot-one-golf] # 机器人型号
arm_control_substeps: 2       # 每步控制子步数（越大控制越精细）
table_height_bias: -0.29      # 桌面高度偏移（m）
table_xy_bias: [0.0, 0.124174] # 桌面水平偏移 [x, y]（m），保持原值
table_length: 0.95            # 桌面长度（m），从0.90小幅增大
table_width: 0.60             # 桌面宽度（m），从0.55小幅增大

embodiment_config_overrides:
  drive_passive_gripper_mimic_targets: true      # 驱动被动夹爪跟随主动夹爪
  drive_all_passive_gripper_mimic_targets: true  # 驱动所有被动夹爪关节
  sync_passive_gripper_mimic_qpos: false         # 不强制同步夹爪位置

kinematic_grasp: false        # 不使用运动学抓取（使用物理仿真抓取）
physical_grasp: true          # 开启物理抓取

hammer_mass: 0.02             # 锤子质量（kg），越大惯性越大
grasp_pre_dis: 0.12           # 抓取前预接近距离（m）
grasp_dis: 0.01               # 抓取最终靠近距离（m）
grasp_close_pos: 0.10         # 夹爪闭合位置
grasp_pose_offset: [-0.005, -0.015, -0.005]  # 抓取姿态偏移 [x, y, z]（m）
grasp_approach_down_angle_deg: 30.0           # 抓取接近角度（度）

place_pre_dis: 0.12           # 放置前预接近距离（m）
place_raise_dis: 0.0          # 放置后抬起距离（m）
place_final_down_iters: 8     # 最终下压迭代次数（敲击力度相关）

language_num: 100             # 语言指令模板数量

# ---------- 域随机化参数（干净场景全部关闭）----------
domain_randomization:
  random_background: false          # 固定背景，不随机
  cluttered_table: false            # 桌面无杂物
  clean_background_rate: 1          # 100% 干净背景
  random_head_camera_dis: 0         # 相机位置固定
  random_table_height: 0            # 桌面高度固定
  random_light: false               # 固定光照
  crazy_random_light_rate: 0        # 无极端光照

# ---------- 相机配置 ----------
camera:
  head_camera_type: D435            # 头部相机型号（Intel RealSense D435）
  wrist_camera_type: GalbotWrist    # 腕部相机型号
  collect_head_camera: true         # 采集头部相机图像
  collect_wrist_camera: true        # 采集腕部相机图像

# ---------- 采集数据类型 ----------
data_type:
  rgb: true                         # 采集 RGB 图像
  third_view: false                 # 不采集第三人称视角
  depth: false                      # 不采集深度图
  pointcloud: false                 # 不采集点云
  observer: false                   # 不采集观察者视角
  endpose: true                     # 采集末端位姿
  qpos: true                        # 采集关节角
  mesh_segmentation: false          # 不采集网格分割
  actor_segmentation: false         # 不采集物体分割

pcd_down_sample_num: 1024           # 点云下采样点数
pcd_crop: true                      # 点云裁剪
save_path: ./data                   # 数据保存路径
clear_cache_freq: 5                 # 每 5 个 episode 清理一次缓存
collect_data: true                  # 是否采集数据
eval_video_log: false               # 采集时不生成视频
